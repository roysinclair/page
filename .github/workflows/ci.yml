name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-build:
    name: swift build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Show Swift version
        run: swift --version
      - name: Build (debug)
        run: swift build -c debug --force-resolved-versions
      - name: Build (release)
        run: swift build -c release --force-resolved-versions
      - name: Unit tests
        # Pure logic + fakes only. The live injection test skips itself
        # unless PAGE_LIVE_SESSION_ID is set.
        run: swift test --force-resolved-versions

  linux-build:
    name: Linux (PageCore + paged)
    runs-on: ubuntu-24.04
    # The official Swift image: toolchain and its apt dependencies.
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Tools the tests drive (tmux, python3)
        run: apt-get update -q && apt-get install -y -q tmux python3
      - name: Show Swift version
        run: swift --version
      - name: Build (debug)
        run: swift build -c debug --force-resolved-versions
      - name: Build paged (release, as install-linux.sh does)
        run: swift build -c release --product paged --static-swift-stdlib --force-resolved-versions
      - name: Unit tests (PageCore, PageLinux)
        run: swift test --force-resolved-versions
      - name: Script syntax
        run: bash -n install-linux.sh && bash -n hooks/page-notify.sh

  ios-build:
    name: iOS build (simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Select Xcode 26
        # The project needs Xcode 26 (Metal toolchain download, iOS 26 SDK);
        # macos-15 images ship it alongside the default Xcode.
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then echo "No Xcode 26 on this runner"; ls -d /Applications/Xcode*.app; exit 1; fi
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
      - name: Install Metal toolchain
        # The iOS target compiles Metal shaders (the Mac app embeds a prebuilt blob, so `swift build` doesn't).
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Regenerate project
        working-directory: iOS
        run: xcodegen generate
      - name: Build iOS app
        working-directory: iOS
        run: |
          xcodebuild \
            -project Page.xcodeproj \
            -scheme Page \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Logic tests
        working-directory: iOS
        run: bash Tests/run-logic-tests.sh

  worker-typecheck:
    name: Worker typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Tests run the TypeScript sources through Node's type stripping
          # (package.json engines: >=22.18).
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: Cloudflare/package-lock.json
      - name: Install deps
        working-directory: Cloudflare
        # --ignore-scripts: no dependency lifecycle script runs in CI; tsc and the tests need none.
        run: npm ci --ignore-scripts
      - name: Type-check
        working-directory: Cloudflare
        # The locally installed compiler, never fetched on demand.
        run: ./node_modules/.bin/tsc --noEmit
      - name: Tests
        working-directory: Cloudflare
        run: npm test

  scripts:
    name: Shell + Python syntax
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: bash -n (macOS bash 3.2)
        run: |
          bash -n hooks/page-notify.sh
          bash -n install.sh
          bash -n build.sh
      - name: Python compile
        run: python3 -m py_compile hooks/page-extract-context.py
