# SonarCloud project settings, read by the CI scan (.github/workflows/sonarcloud.yml).
sonar.projectKey=roysinclair_page
sonar.organization=roysinclair
sonar.projectName=page

# Analyse the whole repository; tests are told apart by the patterns below.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=Tests/**,iOS/Tests/**,Cloudflare/test/**,android/**/src/test/**,android/**/src/androidTest/**,**/*Tests.swift,**/*Test.kt
# sonar.sources and sonar.tests are both ".", so a file may not be both: the same test
# patterns are excluded from the main sources (otherwise "can't be indexed twice").

# Build output, dependencies, generated and binary-heavy folders.
sonar.exclusions=\
  Tests/**,\
  iOS/Tests/**,\
  Cloudflare/test/**,\
  android/**/src/test/**,\
  android/**/src/androidTest/**,\
  **/*Tests.swift,\
  **/*Test.kt,\
  **/.build/**,\
  **/.swiftpm/**,\
  **/build/**,\
  **/.gradle/**,\
  **/node_modules/**,\
  **/dist/**,\
  **/.astro/**,\
  **/.wrangler/**,\
  **/*.generated.swift,\
  **/*.min.js,\
  **/*.min.css,\
  iOS/Page.xcodeproj/**,\
  Resources/**,\
  Designs/**,\
  docs/images/**,\
  website/public/**

sonar.sourceEncoding=UTF-8

# Build output and dependencies are never test code either.
sonar.test.exclusions=\
  **/.build/**,\
  **/build/**,\
  **/node_modules/**,\
  **/dist/**,\
  **/.wrangler/**
