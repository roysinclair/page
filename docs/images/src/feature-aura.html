<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Page Aura and Page Power</title>
<link rel="stylesheet" href="base.css">
<style>
  .win { position: absolute; left: 330px; top: 74px; width: 440px; border-radius: 14px; overflow: hidden; z-index: 3;
    background: #0b0f17; box-shadow: 0 30px 70px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.07); }
  .win .bar { height: 30px; display: flex; align-items: center; padding: 0 12px; background: #0d121b; border-bottom: 1px solid rgba(255,255,255,.05); }
  .win .bar img { height: 17px; display: block; }
  .win .chat { display: block; width: 100%; }
  .row { left: 330px; top: 352px; width: 410px; border-radius: 10px; z-index: 5; box-shadow: 0 20px 50px rgba(0,0,0,.65), 0 0 0 1px rgba(94,234,212,.25); }
  .row-label { position: absolute; left: 334px; top: 334px; z-index: 6; }
  .sock { position: absolute; left: 548px; top: 290px; z-index: 7; display: flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 99px;
    background: rgba(10,14,22,.92); border: 1px solid rgba(167,139,250,.4); font: 600 9.5px/1 var(--mono); color: var(--ink-2); }
  svg.l { position: absolute; inset: 0; z-index: 6; }
</style></head>
<body><div class="canvas feat">
  <div class="sky" data-seed="91"></div>
  <div class="aurora" data-blobs="50,-30,60,70,violet,.30,70; 80,0,40,60,sky,.24,70; 30,70,50,60,teal,.12,90"></div>
  <div class="copy" style="--cw:268px">
    <span class="eyebrow" style="color:var(--violet)"><span class="pulse" style="--s:18px;--c1:#A78BFA;--c2:#38BDF8"><b></b></span>Page Aura</span>
    <h2 class="headline">Your chats, <em class="violet">paged too.</em></h2>
    <p class="caption">A chat app on your own key. Linked to Page Power, the Mac stays awake while a reply streams, and your phone is paged when a chat finishes or asks to use a tool.</p>
  </div>
  <div class="win"><div class="bar"><img src="assets/aura-logo.webp" alt=""></div><img class="chat" src="assets/aura-chat.webp" alt=""></div>
  <svg class="l" viewBox="0 0 800 500"><path d="M650 246 C 656 262, 656 276, 650 290" stroke="#A78BFA" stroke-opacity=".85" stroke-width="1.5" stroke-dasharray="3 5" fill="none" stroke-linecap="round"/><path d="M640 312 C 636 325, 634 335, 634 352" stroke="#5EEAD4" stroke-opacity=".75" stroke-width="1.5" stroke-dasharray="3 5" fill="none" stroke-linecap="round"/><circle cx="650" cy="246" r="2.6" fill="#A78BFA"/></svg>
  <div class="sock"><span class="pulse" style="--s:12px;--c1:#A78BFA;--c2:#38BDF8"><b></b></span>aura.sock · stays on this Mac</div>
  <span class="label row-label">Page · Preferences · Agents</span>
  <div class="render row"><img src="assets/mac-tower-aura-row.webp" alt=""></div>
</div><script src="sky.js"></script></body></html>
