name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

# Read-only by default; the deploy job below asks for the write scopes it needs.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Astro site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json
      - name: Install
        working-directory: website
        # Playwright is only needed to print the brochure locally; skip its browser download in CI.
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        # --ignore-scripts: Astro, Tailwind and the build need no install script (esbuild/sharp ship prebuilt binaries).
        run: npm ci --ignore-scripts
      - name: Build
        working-directory: website
        # The brochure PDF (website/public/page-studio-brochure.pdf) is built locally with `npm run brochure`
        # and committed, so CI only runs the plain Astro build.
        run: npm run build
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: website/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
