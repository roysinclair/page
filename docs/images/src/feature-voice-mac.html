<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Dictate a Steer</title>
<link rel="stylesheet" href="base.css">
<style>
  .card { left: 410px; top: 50px; width: 340px; border-radius: 11px; }
  .copy p { max-width: 270px; text-wrap: pretty; }
</style></head>
<body><div class="canvas feat">
  <div class="sky" data-seed="89"></div>
  <div class="aurora" data-blobs="65,-30,60,70,teal,.24,70; 90,40,40,60,sky,.14,80; 20,70,40,60,amber,.08,90"></div>
  <div class="copy" style="--cw:290px">
    <span class="eyebrow"><span class="pulse" style="--s:18px"><b></b></span>Menu bar</span>
    <h2 class="headline">Dictate a Steer. <em>Return still sends.</em></h2>
    <p class="caption">Click the mic in the Steer box, or press ⌘D, and talk. The words appear as you speak, on this Mac where it can, and nothing goes until you press Return.</p>
    <div class="chips">
      <span class="chip"><span class="dot"></span>⌘D to dictate</span>
      <span class="chip"><span class="dot" style="background:var(--sky);box-shadow:0 0 8px var(--sky)"></span>Esc stops listening</span>
    </div>
  </div>
  <div class="render card shadowed"><img src="assets/mac-popover-voice.webp" alt=""></div>
</div><script src="sky.js"></script></body></html>
